name: SkyFire Application CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to EKS?
        required: true
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: skyfire-api
  IMAGE_TAG: ${{ github.sha }}
  EKS_CLUSTER_NAME: skyfire-eks

jobs:
  build-and-push:
    name: Test, Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-dev.txt

      - name: Test application source
        run: python -m pytest app/tests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            ./app

      - name: Test Docker container
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

          docker run \
            --detach \
            --name skyfire-smoke-test \
            --publish 8000:8000 \
            "$IMAGE"

          trap 'docker logs skyfire-smoke-test || true; docker rm --force skyfire-smoke-test || true' EXIT

          for attempt in {1..10}; do
            if response=$(curl --fail --silent http://127.0.0.1:8000/health); then
              break
            fi

            echo "Waiting for SkyFire container... attempt $attempt/10"
            sleep 2
          done

          test "${response:-}" = '{"status":"ok"}'

      - name: Push Docker Images
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    if: ${{ inputs.deploy == true }}
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.0

      - name: Deploy SkyFire with Helm
        run: |
          helm upgrade --install skyfire ./helm/skyfire \
            --namespace skyfire \
            --create-namespace \
            --set-string image.tag=${{ env.IMAGE_TAG }} \
            --atomic \
            --timeout 5m